# Perfil de produção — NENHUM valor por omissão para segredos. Falha no
# arranque se DATABASE_PASSWORD/JWT_SECRET não estiverem definidos (ver
# ProducaoStartupGuard).
spring:
  datasource:
    # A base de produção: serviço Docker `db_kixima`, base `kixima`, utilizador `kixima`. URL e utilizador NÃO são segredos,
    # por isso trazem esse valor por omissão (e DATABASE_URL_JDBC / DATABASE_USER substituem-no, p. ex. noutro host ou
    # base). A SENHA é um segredo: só vem do ambiente (DATABASE_PASSWORD), sem valor por omissão — sem ela o arranque
    # falha com «Could not resolve placeholder 'DATABASE_PASSWORD'». A configuração local vive em application-dev.yml /
    # application-test.yml (localhost) e nunca toca nesta.
    url: ${DATABASE_URL_JDBC:jdbc:postgresql://db_kixima:5432/kixima}
    username: ${DATABASE_USER:kixima}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
  flyway:
    # Em produção as migrações aplicam-se ao arrancar (ligado por omissão). O Hibernate só VALIDA (ddl-auto: validate),
    # por isso, com o Flyway desligado, uma base sem a migração mais recente recusa arrancar com
    # "Schema-validation: missing column [...]". Base já existente sem histórico: marca-se como V1 e só correm as
    # migrações seguintes (a V1 nunca se repete). Todas são idempotentes e não apagam dados — faz backup antes.
    # Para aplicar as migrações à mão em vez de no arranque: FLYWAY_ENABLED=false.
    enabled: ${FLYWAY_ENABLED:true}

kixima:
  auth:
    jwt-secret: ${JWT_SECRET}

logging:
  level:
    # Mesma variável que config/logger.js (error|warn|info|debug; omissão "info").
    ao.kixima: ${LOG_LEVEL:INFO}
