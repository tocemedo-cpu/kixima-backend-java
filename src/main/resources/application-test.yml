# Perfil de testes JUnit — base Postgres local `kixima_test`. O schema aplica-se por Flyway (ver abaixo); os
# utilizadores NÃO estão aqui nem em nenhum seed: os testes criam-nos em runtime e apagam-nos no fim
# (src/test/java/ao/kixima/testsupport/Contas.java). Ver README.md, "Testes: utilizadores temporários".
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/kixima_test
    username: kixima
    password: kixima
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    # A suite corre SEMPRE contra o schema actual: o Flyway aplica as migrações em falta (hoje, a V2 numa base que só
    # tem a V1) antes de o Hibernate validar. Sem isto, uma kixima_test criada antes da V2 falha com
    # "Schema-validation: missing column [onboarding_draft] in table [companies]" e só se corrigia à mão.
    # Numa base que já tem o schema mas não tem histórico (baseline-on-migrate, baseline-version: 1 — ver application.yml)
    # nada da V1 é repetido; a V2 é idempotente. Só acrescenta estrutura (nunca apaga dados). O utilizador da base de
    # testes tem de ser o dono das tabelas (DDL). A validação do Hibernate continua activa (ddl-auto: validate).
    enabled: true

sentry:
  # Como no Node (`config.sentry.dsn && !config.isTest`): nos testes o Sentry nunca liga, mesmo com SENTRY_DSN no ambiente.
  enabled: false

kixima:
  # Como no Node (rateLimit.js desliga-se em NODE_ENV=test): a configuração real testa-se em RateLimitFilterTest.
  rate-limit:
    enabled: false
  auth:
    jwt-secret: teste-jwt-secret-com-pelo-menos-32-caracteres-000000
  erp:
    # 32 bytes em hex — só para os testes, nunca uma chave real.
    config-encryption-key: "aab062c1f56d3cbf37c5e15cf2f33260887d9d5e6b177005142c363df9d6ea94"
  integration:
    # Só para os testes (erp-doa-approval.test.js); a falha fechada testa-se com a propriedade vazia.
    callback-secret: segredo-teste-erp-doa
  api-catalogo:
    # Só para o teste do limite de taxa — em produção são 120 (a omissão em application.yml).
    limite-por-minuto: 30
